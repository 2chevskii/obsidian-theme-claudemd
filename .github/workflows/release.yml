on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - id: get-version
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          if [[ "$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match manifest version '$manifest_version'." >&2
            exit 1
          fi
          echo "theme-version=$manifest_version" >> "$GITHUB_OUTPUT"
      - run: tar -czf "Claude.md_${{ steps.get-version.outputs.theme-version }}.tar.gz" -C dist manifest.json theme.css
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.get-version.outputs.theme-version }}" \
            --title "Claude.md ${{ steps.get-version.outputs.theme-version }}" \
            --generate-notes \
            dist/manifest.json \
            dist/theme.css \
            "Claude.md_${{ steps.get-version.outputs.theme-version }}.tar.gz"
